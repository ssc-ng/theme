name: Set up Ruby with the newest SSC-NG theme
description: >-
  Installs Ruby and the site's gems, keeping everything pinned by Gemfile.lock
  except ssc-ng-theme, which moves to the newest v1. The changed lock file is
  never committed.
inputs:
  working-directory:
    description: Folder holding the site's Gemfile
    required: true
  ruby-version:
    description: Ruby version
    default: "3.3"
runs:
  using: composite
  steps:
    # Installs from the committed lock file, so its cache stays valid when the
    # theme moves.
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ inputs.ruby-version }}
        bundler-cache: true
        working-directory: ${{ inputs.working-directory }}
    # Not `bundle lock --update`: that leaves a git gem at its committed
    # revision and bumps other gems. setup-ruby turns on deployment mode, which
    # would refuse this change to the lock file.
    - name: Move the theme to the newest v1
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BUNDLE_DEPLOYMENT: "false"
        BUNDLE_FROZEN: "false"
      run: bundle update ssc-ng-theme --conservative
